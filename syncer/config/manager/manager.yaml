apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: krmsyncer-controller-manager
  name: krmsyncer-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krmsyncer-controller-manager
  namespace: krmsyncer-system
  labels:
    control-plane: krmsyncer-controller-manager
spec:
  selector:
    matchLabels:
      control-plane: krmsyncer-controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: krmsyncer-controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /manager
        args:
        - --v=2
        # KRMSyncers in the controller's own namespace may sync other namespaces
        # (rules with "*" or other namespaces). KRMSyncers elsewhere can only
        # sync their own namespace. deploy.sh adds the KRMSyncer CR's namespace
        # if --namespace is set to another namespace.
        - --trusted-namespaces=$(POD_NAMESPACE)
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: controller:latest
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: krmsyncer-controller-manager
      terminationGracePeriodSeconds: 10
